<script>
  // ヘッダーの開閉インタラクション(fetch挿入後に実行される想定)
  (function initToriiHeader() {
    var header = document.querySelector('.th-header');
    if (!header || header.dataset.thInit) return;
    header.dataset.thInit = 'true';

    // ドロップダウン(Services / About / Resources)
    header.querySelectorAll('[data-th-dropdown]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var expanded = btn.getAttribute('aria-expanded') === 'true';
        header.querySelectorAll('[data-th-dropdown]').forEach(function (b) {
          b.setAttribute('aria-expanded', 'false');
        });
        btn.setAttribute('aria-expanded', String(!expanded));
      });
    });

    // モバイルメニュー
    var burger = header.querySelector('[data-th-burger]');
    var panel = header.querySelector('[data-th-mobile-panel]');
    if (burger && panel) {
      burger.addEventListener('click', function () {
        var open = panel.classList.toggle('is-open');
        burger.setAttribute('aria-expanded', String(open));
      });
    }

    // 現在ページのナビ項目に aria-current="page" を付与
    // (/faq, /faq.html, /faq.htm, /faq/ をすべて同じページとみなす)
    function normalize(path) {
      return path.replace(/\/index\.html?$/, '/').replace(/\.html?$/, '').replace(/\/+$/, '') || '/';
    }
    var here = normalize(location.pathname);
    header.querySelectorAll('.th-header__nav-list a[href]').forEach(function (a) {
      if (a.hostname !== 'toriihealth.org' && a.hostname !== 'www.toriihealth.org' && a.hostname !== location.hostname) return;
      if (normalize(a.pathname) === here) a.setAttribute('aria-current', 'page');
    });

    document.addEventListener('click', function (e) {
      if (!header.contains(e.target)) {
        header.querySelectorAll('[data-th-dropdown]').forEach(function (b) {
          b.setAttribute('aria-expanded', 'false');
        });
      }
    });
  })();
</script>
